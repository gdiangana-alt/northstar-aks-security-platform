apiVersion: v1
kind: Namespace
metadata:
  name: workloads
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-reader
  namespace: workloads
  annotations:
    azure.workload.identity/client-id: b330769e-3c07-4f3c-8c6b-3513b62a7480
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: aks-demo-kv
  namespace: workloads
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: b330769e-3c07-4f3c-8c6b-3513b62a7480
    keyvaultName: northstarakskv244d087a
    tenantId: 2fd8cc77-2567-43b2-9ec2-45443ff160c6
    objects: |
      array:
        - |
          objectName: aks-demo-secret
          objectType: secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-reader
  namespace: workloads
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-reader
  template:
    metadata:
      labels:
        app: secret-reader
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: secret-reader
      # Temporary exception for secret-mount validation on the one-node lab cluster.
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
          effect: NoSchedule
      containers:
        - name: reader
          image: busybox:1.36
          command: ["/bin/sh", "-c", "sleep 3600"]
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: aks-demo-kv
